<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1 class="title">Formulario de Registro</h1>
        <form action="/processa-dados" method="post">
 <div>
   <label for="nome">Nome:</label>
   <input type="text" id="nome" name="usuario_nome" required>
 </div>
 <div>
   <label for="email">E-mail:</label>
   <input type="email" id="email" name="usuario_email" required>
 </div>
 <div>
   <label for="telefone">Telefone:</label>
   <input type="tel" id="telefone" name="usuario_telefone" required>
 </div>
 <div class="button">
   <button type="submit">Enviar</button>
 </div>
</form>
    </body>
</html>
